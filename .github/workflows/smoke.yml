name: Portfolio Chrome smoke tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/verify-site.mjs'
      - '.github/workflows/smoke.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser test driver
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Verify Chrome desktop and mobile UI
        run: node scripts/verify-site.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-screenshots
          path: smoke-screenshots/
          if-no-files-found: ignore
